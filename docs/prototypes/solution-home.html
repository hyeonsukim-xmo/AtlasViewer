<style>
:root{color-scheme:dark;font-family:Inter,Pretendard,"Segoe UI","Malgun Gothic",sans-serif;background:#09091b;color:#e6e9fa;font-synthesis:none;font-size:14px}*{box-sizing:border-box}body{margin:0}button,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid #39374f;border-radius:7px;padding:9px 14px;background:#1b1a32;white-space:nowrap}button:hover{background:#282640}button:focus-visible,select:focus-visible,tr:focus-visible{outline:2px solid #b8aed5;outline-offset:3px}button:disabled{opacity:.45;cursor:default}button.primary{background:#d7cee9;color:#171226;border-color:#d7cee9;font-weight:600}button.text{background:transparent;border-color:transparent;color:#b6bddc}button.small{font-size:12px;padding:6px 10px}a{color:#bdc4ed}small,.muted{color:#929bbd}small{display:block;font-size:12px;line-height:1.7}.top{height:72px;display:flex;align-items:center;gap:24px;padding:0 34px;border-bottom:1px solid #252439;background:#101025}.logo{font-size:27px;letter-spacing:2px;font-weight:800}.org{padding-left:24px;border-left:1px solid #353449;line-height:1.6}.top-right{display:flex;align-items:center;gap:14px;margin-left:auto}.dot{display:inline-block;width:6px;height:6px;background:#7bbda9;border-radius:50%;margin-right:7px}.dot.warn{background:#d7af7e}.status-summary{font-size:12px;color:#a7b9c7}.tabs{display:flex;gap:26px;padding:0 34px;border-bottom:1px solid #252439;background:#0e0e22}.tabs button{background:none;border:0;border-radius:0;padding:17px 0;color:#969fbc;border-bottom:2px solid transparent}.tabs button.active{color:#ede9fa;border-bottom-color:#b6a6ce}.tabs .right{margin-left:auto;font-size:12px;color:#7e87a7;align-self:center}.content{max-width:1480px;padding:32px 34px 70px;margin:auto}.heading{display:flex;align-items:flex-end;gap:20px;margin-bottom:23px}.heading h1{font-size:25px;letter-spacing:-.7px;margin:0 0 8px;font-weight:650}.heading p{color:#9aa4c5;font-size:13px;line-height:1.6;margin:0}.heading .actions{display:flex;gap:8px;margin-left:auto}.panel{border:1px solid #302e4a;border-radius:12px;overflow:hidden;background:linear-gradient(125deg,#13122d,#0e0e25);margin-bottom:26px}.panel-title{display:flex;align-items:center;gap:12px;padding:17px 20px;border-bottom:1px solid #24233b;font-size:14px;font-weight:600}.panel-title small{font-weight:400;margin-left:auto}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}th{color:#929cbe;font-size:12px;font-weight:400;background:#141329;padding:13px 20px;border-bottom:1px solid #25243e;white-space:nowrap}td{padding:18px 20px;border-bottom:1px solid #23213b;font-size:13px;line-height:1.5}tr:last-child td{border-bottom:0}tr[data-product],tr[data-result]{cursor:pointer}tr[data-product]:hover,tr[data-result]:hover{background:#1c1a36}tr.selected{background:#24203e}td strong{font-weight:600;display:block;margin-bottom:3px}.modality{font-size:12px;color:#c0c8e1}.pill{display:inline-flex;align-items:center;padding:3px 7px;border-radius:4px;color:#a4d1c3;background:#20352f70;font-size:11px;white-space:nowrap}.pill.warn{color:#dcb990;background:#40301f70}.pill.neutral{color:#abb2d1;background:#28263d}.pill.bad{color:#e3a7ac;background:#42233170}.license{min-width:104px}.row-action{text-align:right;min-width:138px}.banner{background:#272038;border:1px solid #59465f;border-radius:8px;padding:13px 17px;line-height:1.65;font-size:13px;margin-bottom:23px;display:flex;gap:16px;align-items:center}.banner button{margin-left:auto}.banner.info{border-color:#343950;background:#151b2d}.summary-line{display:flex;gap:18px;flex-wrap:wrap;color:#969fbc;font-size:12px;margin-bottom:22px}.summary-line b{font-weight:500;color:#c3c9df}.footer{display:flex;justify-content:space-between;font-size:12px;color:#7f88a9;line-height:1.7;margin-top:20px}.login{max-width:560px;margin:45px auto}.login .body{padding:28px}.login h1{font-size:25px;margin:0 0 12px}.login p{line-height:1.9;color:#a8b0cc}.login .primary{width:100%;margin:18px 0 7px;padding:13px}.login .text{width:100%}.rules{border-top:1px solid #302d48;margin-top:23px;padding-top:16px;font-size:12px;line-height:1.9;color:#8993b3}.setup-row{display:flex;gap:18px;padding:23px;border-bottom:1px solid #27253d;align-items:center}.setup-row:last-child{border:0}.step{width:28px;height:28px;display:grid;place-items:center;border:1px solid #49415d;border-radius:50%;color:#cab9d9;font-size:12px}.setup-row button{margin-left:auto}.setup-row strong{font-size:14px}.progress{width:150px;max-width:100%;height:4px;background:#333149;border-radius:3px;margin:9px 0}.progress span{display:block;background:#ac9ac4;height:100%;width:46%;border-radius:3px}.empty{padding:40px;text-align:center;color:#9da7c7}.design-bar{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#1b1930;border-top:1px solid #514866;padding:10px 22px;display:flex;align-items:center;gap:16px;font-size:12px;color:#afa6c7}.design-bar strong{color:#ddd1eb;font-size:12px}.design-bar select{border:1px solid #544a69;border-radius:5px;background:#121122;padding:5px 9px;max-width:220px}.design-bar .note{margin-left:auto;color:#a69cba}dialog{max-width:530px;width:calc(100% - 36px);color:#e6e9fa;background:#19172e;border:1px solid #514862;border-radius:12px;padding:27px;box-shadow:0 16px 70px #0008}dialog::backdrop{background:#04040db8}dialog h2{font-size:20px;margin-top:0}dialog p{color:#bcc2da;line-height:1.8}dialog .buttons{display:flex;justify-content:flex-end;gap:10px;margin-top:25px}#notice{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#e1d8ed;color:#211a30;padding:13px 20px;border-radius:8px;box-shadow:0 8px 24px #0005;max-width:90vw;z-index:9;font-size:13px}.filters{display:flex;gap:8px}.filters button.active{border-color:#9d8bb8;background:#27213c}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.info-grid .panel{padding:22px}.info-grid h2{font-size:15px;margin:0 0 12px}.info-grid p{font-size:13px;line-height:1.9;color:#a1acc9;margin:0}.details{font-size:12px;color:#929dbb}.compact td{padding-top:14px;padding-bottom:14px}.w-name{min-width:210px}.result-name{min-width:160px}.checks{color:#c5b5db;margin-right:9px}.remote-badge{border:1px solid #4e455e;border-radius:5px;padding:4px 8px;font-size:11px;color:#c9bad8}
@media(max-width:950px){.top{padding:0 20px;gap:14px}.org{padding-left:14px}.top-right .status-summary{display:none}.tabs{padding:0 20px;gap:20px}.content{padding:25px 20px 100px}td,th{padding-left:14px;padding-right:14px}.secondary-col{display:none}.design-bar{flex-wrap:wrap;gap:8px}.design-bar .note{display:none}.info-grid{grid-template-columns:1fr}.row-action{min-width:120px}.heading{align-items:flex-start}.heading .actions{flex-wrap:wrap;justify-content:flex-end}}
@media(max-width:620px){.top{height:auto;min-height:72px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}.org{font-size:12px}.top-right{gap:8px}.tabs{gap:16px;overflow:auto;white-space:nowrap}.tabs .right{display:none}.heading{display:block}.heading .actions{justify-content:flex-start;margin-top:16px}.footer{display:block}.login{margin:10px auto}.setup-row{padding:16px;gap:12px}.setup-row button{font-size:12px}.license{min-width:85px}.w-name{min-width:180px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="design-bar" aria-label="설계 모형 제어"><strong>DESIGN PREVIEW</strong><label>상태 <select id="scenario"><option value="ready">일상 · 일부 솔루션 미설치</option><option value="signed-out">계정 로그아웃</option><option value="offline">오프라인 · 유예 유효</option><option value="no-key">동글 없음</option><option value="partial">상품 만료 · 설치 오류</option><option value="setup">최초 설치 · 활성화 전</option><option value="remote">웹 / 태블릿 열람</option><option value="comparison">호환 결과 비교</option></select></label><span>가상 기관·가상 결과</span><span class="note">실제 로그인·설치·분석·전송을 수행하지 않는 설계 모형</span></div>
<dialog id="detail"><h2 id="dialog-title"></h2><p id="dialog-body"></p><div class="buttons"><button id="dialog-close">닫기</button><button class="primary" id="dialog-confirm" hidden>확인</button></div></dialog><div id="notice" role="status" hidden></div>
<script>
const products=[
 {id:'ct',name:'CT Thigh',description:'허벅지 근육 분석',modality:'CT',protocol:'3D CT · HU',output:'체적 · HU fat-range · 3D',size:'6.2 GB'},
 {id:'mri',name:'MRI Thigh',description:'허벅지 근육 분석',modality:'MRI',protocol:'3D Water sequence',output:'체적 · TTA / QC · 3D',size:'4.1 GB'},
 {id:'xray',name:'X-ray Lower Extremity',description:'하지 근육 투영 분석',modality:'X-ray',protocol:'Lt / AP / Rt',output:'투영 면적 · Overlay',size:'5.0 GB'}
];
const cases=[
 {id:'case-01',name:'DEMO-001',study:'2026.10.17 · Lower extremity',solution:'CT Thigh',summary:'Raw · 3D 준비됨',qc:'검토 필요',cloud:false,comparison:{quantity:'native-volume',unit:'cm³',ontology:'ct-thigh-33-v1',method:'native-voxel-v1',coverage:'whole-thigh'}},
 {id:'case-02',name:'DEMO-002',study:'2026.10.17 · Lt / AP / Rt',solution:'X-ray Lower Extremity',summary:'Lt · AP · Rt',qc:'검토 전',cloud:true,comparison:{quantity:'projection-area',unit:'cm²',ontology:'xray-projection-v1',method:'projection-pixel-v1',coverage:'lower-extremity'}},
 {id:'case-03',name:'DEMO-003',study:'2026.10.16 · Water',solution:'MRI Thigh',summary:'PP500 · 3D 준비됨',qc:'검토 완료',cloud:true,comparison:{quantity:'native-volume',unit:'cm³',ontology:'mri-thigh-28-v1',method:'native-voxel-v1',coverage:'whole-thigh'}}
];
const comparisonCases=[cases[2],{...cases[2],id:'case-04',name:'DEMO-004',study:'2026.10.16 · Water'},{...cases[2],id:'case-05',name:'DEMO-005',study:'2026.10.15 · Water'}];
const initial=()=>({surface:'desktop',page:'home',returnPage:'home',scenario:'ready',signed:true,online:true,key:true,active:true,mriInstalled:false,tab:'owned',compare:false,selected:[],comparisonMessage:'',published:false});
let state=initial(),confirmAction=null,noticeTimer;
const app=document.getElementById('app');
const badge=(text,type='')=>`<span class="pill ${type}">${text}</span>`;
function isPublished(row){return row.cloud||(row.id==='case-01'&&state.published)}
function visibleCases(){const rows=state.scenario==='comparison'?comparisonCases:cases;return state.surface==='remote'||state.page==='remote'?rows.filter(isPublished):rows}
function comparisonIssue(ids){
 if(ids.length>3)return '최대 3개 결과를 선택하세요.';
 const rows=ids.map(id=>visibleCases().find(row=>row.id===id));
 for(const [field,label] of [['quantity','지표 종류'],['unit','단위'],['ontology','구조 분류'],['method','계산법'],['coverage','촬영 범위']]){
  if(rows.some(row=>!row?.comparison?.[field]))return `${label} 정보가 없어 수치 비교할 수 없습니다.`;
  if(rows.some(row=>row.comparison[field]!==rows[0].comparison[field]))return `${label} 불일치: 같은 기준의 결과를 선택하세요.`;
 }
 return '';
}
function navigate(page){
 const allowed=state.surface==='remote'?['remote','login']:['home','results','sync','manage','login','setup','remote'];
 state.page=allowed.includes(page)?page:state.surface==='remote'?'remote':'home';
 state.compare=false;state.selected=[];state.comparisonMessage='';render();
}
function openLogin(){if(state.page!=='login')state.returnPage=state.page;navigate('login')}
function availability(p){
 if(!state.active)return {label:'PC 등록 필요',type:'warn',action:'등록 안내',kind:'register'};
 if(state.scenario==='partial'&&p.id==='mri')return {label:'사용권 만료',type:'warn',action:'권한 확인',kind:'expired'};
 if(state.scenario==='partial'&&p.id==='xray')return {label:'설치 검증 실패',type:'bad',action:'설치 복구',kind:'repair'};
 if(p.id==='mri'&&!state.mriInstalled)return {label:'설치 필요',type:'neutral',action:'설치',kind:'install'};
 if(!state.key)return {label:'등록된 키 필요',type:'warn',action:'키 연결 안내',kind:'key'};
 return {label:'분석 가능',type:'',action:'분석 시작',kind:'analyze'};
}
function header(){const remote=state.surface==='remote';return `<header class="top"><div class="logo">EXMO</div><div class="org">예시 기관 · EXMO Lab<small>${remote?'기관 결과 workspace':'RAD-DESKTOP-01 · 등록 PC'}</small></div><div class="top-right">${remote?'<span class="remote-badge">RESULT VIEWER</span>':`<span class="status-summary"><i class="dot ${!state.key||!state.online?'warn':''}"></i>${!state.active?'PC 등록 필요':!state.key?'키 미연결':!state.online?'오프라인 유예 사용':'PC · 키 인증 준비'}</span>`}<button class="small" data-action="account">${state.signed?'검토 사용자 ▾':'로그인'}</button></div></header><nav class="tabs" aria-label="주요 메뉴">${remote?'<button class="active" data-page="remote">기관 결과</button><button data-action="workspace">Workspace</button>':[['home','분석 작업'],['results','결과'],['sync','전송 현황'],['manage','솔루션 관리']].map(([id,name])=>`<button data-page="${id}" class="${(state.page===id||(id==='results'&&state.page==='remote'))?'active':''}">${name}${id==='sync'?' · 2':''}</button>`).join('')}<span class="right">${remote?'웹 · 태블릿 · 읽기 전용':'Desktop · Local analysis'}</span></nav>`}
function banners(){if(!state.active)return `<div class="banner">구매한 솔루션을 사용하려면 이 PC와 YubiKey를 등록하세요.<button class="small" data-page="setup">PC 등록</button></div>`;if(!state.online)return `<div class="banner info">오프라인 사용 중 · 현재 장비 권한은 유효합니다. 로컬 분석은 가능하며 서버 전송은 연결 복구 후 진행됩니다.</div>`;if(!state.key)return `<div class="banner">등록된 YubiKey를 연결하면 새 분석을 시작할 수 있습니다. 기존 결과는 계속 열람할 수 있습니다.</div>`;if(!state.signed)return `<div class="banner info">로컬 분석은 사용할 수 있습니다. 서버에 결과를 게시하거나 원격 결과를 보려면 로그인하세요.<button class="small" data-page="login">계정 연결</button></div>`;return ''}
function productTable(){return `<div class="panel"><div class="panel-title">이 PC의 솔루션<small>선택한 분석 작업에 영상을 등록합니다</small></div><div class="table-wrap"><table aria-label="구매 솔루션"><thead><tr><th>솔루션</th><th>Modality / 입력 조건</th><th class="secondary-col">결과</th><th>사용권</th><th>상태</th><th></th></tr></thead><tbody>${products.map(p=>{const a=availability(p),expired=state.scenario==='partial'&&p.id==='mri';return `<tr tabindex="0" data-product="${p.id}"><td class="w-name"><strong>${p.name}</strong><small>${p.description}</small></td><td><span class="modality">${p.modality}</span><small>${p.protocol}</small></td><td class="secondary-col">${p.output}</td><td class="license">${badge(!state.active?'확인 전':expired?'갱신 필요':'사용 가능',expired?'warn':'neutral')}<small>${expired?'2026.10.16 만료':!state.active?'기관 승인 필요':'이 PC에 배정됨'}</small></td><td>${badge(a.label,a.type)}${a.kind==='install'?'<small>용량 확인 후 설치</small>':''}</td><td class="row-action"><button class="small ${a.kind==='analyze'?'primary':''}" data-product-action="${p.id}">${a.action}</button></td></tr>`}).join('')}</tbody></table></div></div>`}
function resultTable(remote=false){const rows=visibleCases(),issue=comparisonIssue(state.selected);return `<div class="panel"><div class="panel-title">${remote?'기관 결과':'최근 결과'}<small>${remote?'계정에 허용된 workspace의 결과':'이 PC에 저장된 분석 결과'}</small><button class="text small" data-action="compare">${state.compare?'선택 모드 닫기':'비교 선택'}</button></div><div class="table-wrap"><table class="compact" aria-label="분석 결과"><thead><tr><th>검사 / Study</th><th>솔루션</th><th class="secondary-col">결과</th><th>QC</th><th>${remote?'게시 상태':'저장 위치'}</th><th></th></tr></thead><tbody>${rows.map(c=>`<tr tabindex="0" data-result="${c.id}" class="${state.selected.includes(c.id)?'selected':''}" ${state.compare?`aria-selected="${state.selected.includes(c.id)}"`:''}><td class="result-name"><strong>${state.compare?`<span class="checks">${state.selected.includes(c.id)?'☑':'☐'}</span>`:''}${c.name}</strong><small>${c.study}</small></td><td>${c.solution}</td><td class="secondary-col">${c.summary}</td><td>${badge(c.qc,c.qc==='검토 필요'?'warn':'neutral')}</td><td>${badge(isPublished(c)?'서버 저장됨':'로컬 저장',isPublished(c)?'':'neutral')}</td><td class="row-action"><button class="text small" data-open="${c.id}" aria-label="${c.name} 결과 열기">결과 열기</button></td></tr>`).join('')}</tbody></table></div>${state.compare?`<div class="panel-title"><small>${issue||state.comparisonMessage||'같은 지표·단위·구조 분류·계산법·촬영 범위의 결과 최대 3개'}</small><button class="small" data-action="compare-open" ${state.selected.length<2||issue?'disabled':''}>${state.selected.length}개 선택</button></div>`:''}</div>`}
function home(){return `${banners()}<div class="heading"><div><h1>분석 작업</h1><p>사용할 솔루션을 선택한 뒤 영상을 등록합니다.</p></div><div class="actions"><button class="text" data-page="manage">설치 · 사용권 관리</button></div></div>${productTable()}${resultTable()}<footer class="footer"><span>영상 등록 → 검토 → 분석 → 측정·Overlay → 3D</span><span>원본 영상은 이 PC에 보관됩니다</span></footer>`}
function login(){return `<section class="login panel"><div class="body"><h1>${state.surface==='remote'?'기관 결과에 로그인':'결과를 기관 계정에 연결'}</h1><p>${state.surface==='remote'?'허가받은 기관의 분석 결과를 열람하고 비교합니다.':'분석 결과를 기관 서버에 게시하고 웹·태블릿에서 확인할 때 로그인합니다. 이 PC의 솔루션 사용권은 장비와 YubiKey로 별도 관리됩니다.'}</p><button class="primary" data-action="sign-in">브라우저에서 로그인</button><button class="text" data-action="login-back">돌아가기</button><div class="rules">원본 영상은 자동 업로드되지 않습니다.<br>로그인만으로 다른 기관 데이터나 미구매 솔루션의 권한이 생기지 않습니다.<br>설계 모형에서는 실제 인증 정보를 입력받지 않습니다.</div></div></section>`}
function manage(){return `<div class="heading"><div><h1>솔루션 관리</h1><p>이 PC와 등록된 키에 배정된 사용권 · 솔루션 추가 시 같은 프로그램을 사용합니다.</p></div><button class="text" data-action="refresh">권한 새로 확인</button></div><div class="summary-line"><span>기관 <b>EXMO Lab (예시)</b></span><span>장비 <b>RAD-DESKTOP-01</b></span><span>키 <b>${state.key?'등록된 키 연결됨':'미연결'}</b></span><span>PC 이전 <b>관리자 승인 필요</b></span></div><div class="filters" style="margin-bottom:16px"><button data-catalog="owned" class="${state.tab==='owned'?'active':''}">보유 솔루션</button><button data-catalog="other" class="${state.tab==='other'?'active':''}">다른 솔루션</button></div>${state.tab==='owned'?productTable():`<div class="panel"><div class="panel-title">추가 솔루션 · 확장 예시</div><div class="empty">새 솔루션은 이 목록에서 확인합니다.<br><small>미구매 모델을 자동 설치하거나 새 프로그램을 따로 설치하지 않습니다.</small><button style="margin-top:18px" data-action="future">CT 추가 분석 · 확장 정책 보기</button></div></div>`}<div class="info-grid"><div class="panel"><h2>솔루션 제거</h2><p>설치된 모델을 제거해도 기존 입력과 분석 결과는 보존됩니다. 다른 솔루션이 사용하는 공용 실행 환경은 유지됩니다.</p></div><div class="panel"><h2>사용권과 계정</h2><p>계정 로그인은 서버 결과의 접근 권한을 확인합니다. 솔루션 실행 권한은 등록된 PC·YubiKey·구매 계약으로 결정됩니다.</p></div></div>`}
function sync(){return `${!state.signed||!state.online?banners():''}<div class="heading"><div><h1>전송 현황</h1><p>게시하도록 선택한 결과만 기관 workspace에 전송합니다. 분석 작업은 독립적으로 계속됩니다.</p></div></div><div class="panel"><div class="panel-title">EXMO Lab · 연구/검토 workspace<small>원본 영상 제외</small></div><div class="table-wrap"><table><thead><tr><th>검사 / 결과</th><th>전송 항목</th><th>상태</th><th></th></tr></thead><tbody><tr><td><strong>DEMO-001 · CT Thigh</strong><small>Raw · revision 1</small></td><td>측정 · QC · 보호 Mask<small>3D가 준비되면 같은 결과에 추가됩니다</small></td><td>${badge(state.published?'서버 저장됨':!state.signed?'로그인 필요':!state.online?'연결 대기':'게시 대기',state.published?'':'neutral')}</td><td class="row-action"><button class="small" data-action="publish" ${state.published?'disabled':''}>${state.published?'게시됨':!state.signed?'로그인':'전송 시작'}</button></td></tr><tr><td><strong>DEMO-002 · X-ray</strong><small>Lt · AP · Rt</small></td><td>측정 · QC · 보호 Mask · 대표 Overlay</td><td>${badge('서버 저장됨')}<small>임상 검토 상태는 별도로 관리됩니다</small></td><td class="row-action"><button class="text small" data-page="remote">서버 결과 보기</button></td></tr></tbody></table></div></div><div class="info-grid"><div class="panel"><h2>Mask 보호</h2><p>Native Mask는 서버 내부 보호 저장소에 보관합니다. 웹·태블릿에는 측정값, 표시용 3D, 승인된 Overlay만 전달합니다.</p></div><div class="panel"><h2>실패해도 로컬 결과 유지</h2><p>통신 오류나 저장 공간 부족이 발생하면 해당 전송만 보류합니다. 원본과 완료된 분석 결과는 삭제하지 않습니다.</p></div></div>`}
function setup(){return `<div class="heading"><div><h1>이 PC에서 사용할 솔루션 준비</h1><p>최초 등록은 온라인에서 진행합니다. 이후에는 유효한 장비 권한으로 로컬 분석을 사용할 수 있습니다.</p></div></div><div class="panel">${[['1','기관 관리 계정 확인','구매 계약과 기관을 확인합니다.'],['2','PC와 YubiKey 등록','PC 1대에 귀속 · 관리자 승인으로 이전 가능'],['3','구매 솔루션 확인','CT · MRI · X-ray 중 배정된 솔루션'],['4','선택 설치','필요한 패키지와 공용 실행 환경을 검증합니다.']].map(([i,title,desc])=>`<div class="setup-row"><span class="step">${i}</span><div><strong>${title}</strong><small>${desc}</small></div>${i==='1'?'<button class="small" data-action="sign-in">계정 확인</button>':''}</div>`).join('')}</div><button class="primary" data-action="finish-setup">등록 완료 상태 미리보기</button><p class="details">설계 모형입니다. 실제 PC/키 등록이나 다운로드를 수행하지 않습니다.</p>`}
function remote(){return `<div class="heading"><div><h1>기관 결과</h1><p>${state.surface==='remote'?'웹·태블릿에서는 게시된 결과를 열람합니다. 신규 영상 업로드나 분석 기능은 없습니다.':'기관 서버에 게시된 결과를 확인합니다. 분석 작업은 상단 메뉴에서 계속할 수 있습니다.'}</p></div>${state.surface==='desktop'?'<button class="text" data-page="results">로컬 결과로 돌아가기</button>':''}<span class="remote-badge">EXMO Lab · 읽기 전용</span></div>${state.signed?resultTable(true):`<div class="panel empty">기관 결과를 보려면 로그인하세요.<p><button data-action="sign-in">로그인</button></p></div>`}<div class="info-grid"><div class="panel"><h2>열람 범위</h2><p>측정값 · QC · 표시용 3D · 게시된 대표 Overlay. 전체 슬라이스를 게시하지 않은 결과는 원격 slice 스크롤을 제공하지 않습니다.</p></div><div class="panel"><h2>장비와 다른 권한</h2><p>태블릿에는 라이선스 동글이 필요하지 않습니다. 해당 결과를 볼 수 있는 기관 계정 권한이 필요합니다.</p></div></div>`}
function render(){const pages={home,manage,sync,login,setup,remote,results:()=>`<div class="heading"><div><h1>분석 결과</h1><p>로컬 결과와 게시 상태를 확인합니다.</p></div><button class="text" data-page="remote">서버 결과 보기</button></div>${resultTable()}`};app.innerHTML=header()+`<main class="content">${pages[state.page]()}</main>`}
function notice(text){clearTimeout(noticeTimer);const node=document.getElementById('notice');node.textContent=text;node.hidden=false;noticeTimer=setTimeout(()=>node.hidden=true,3800)}
function dialog(title,body,action,label='확인'){document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-body').textContent=body;confirmAction=action;const button=document.getElementById('dialog-confirm');button.hidden=!action;button.textContent=label;document.getElementById('detail').showModal()}
function productAction(id){const p=products.find(p=>p.id===id),a=availability(p);if(a.kind==='analyze')return dialog(p.name+' · 분석 작업','설계 모형입니다. 실제 제품에서는 기존 영상 등록 → 검토 → 분석 workspace가 열립니다. 모델과 계산 설정은 이 홈 변경으로 바뀌지 않습니다.');if(a.kind==='install'){if(!state.online)return dialog('온라인 설치 필요','유효한 로컬 분석은 계속할 수 있습니다. 새 패키지는 연결 복구 후 설치하거나 이미 승인된 오프라인 패키지를 사용합니다.');return dialog('MRI Thigh 설치','구매한 솔루션의 검증된 패키지를 설치합니다. 표기 용량은 설계 예시이며 실제 manifest에서 계산합니다.',()=>{state.mriInstalled=true;render();notice('설치 완료 상태로 전환한 모형입니다. 다운로드하지 않았습니다.')},'완료 상태 보기')}const messages={register:'기관 관리자가 이 PC와 등록 키의 구매 권한을 확인한 뒤 활성화합니다.',expired:'이 상품의 신규 분석은 갱신 후 사용할 수 있습니다. 기존 결과와 다른 유효 솔루션은 계속 사용할 수 있습니다.',repair:'이 상품의 설치 검증에 실패했습니다. 정상 상품과 기존 결과는 유지하고 해당 설치만 복구합니다.',key:'등록된 YubiKey를 연결하세요. 기존 결과 열람과 로그인된 계정의 서버 조회는 가능합니다.'};dialog(a.label,messages[a.kind])}
function openResult(id){dialog('결과 열람 · '+visibleCases().find(c=>c.id===id).name,'실제 제품에서는 기존 측정·Overlay·3D viewer가 열립니다. 이 모형은 가상 결과만 표시합니다.',state.surface==='remote'?null:()=>navigate('sync'),'게시 상태 확인')}
function resultAction(id){
 if(!state.compare)return openResult(id);
 const restoreFocus=document.activeElement.getAttribute('data-result')===id;
 const removing=state.selected.includes(id),next=removing?state.selected.filter(x=>x!==id):[...state.selected,id];
 const issue=comparisonIssue(next);state.comparisonMessage=issue;
 if(removing||!issue)state.selected=next;
 render();
 if(restoreFocus)document.querySelector('[data-result="'+CSS.escape(id)+'"]')?.focus({preventScroll:true});
}
app.addEventListener('click',event=>{const el=event.target.closest('button,[data-product],[data-result]');if(!el)return;if(el.dataset.page){if(el.dataset.page==='login')openLogin();else navigate(el.dataset.page);return}if(el.dataset.productAction||el.dataset.product)return productAction(el.dataset.productAction||el.dataset.product);if(el.dataset.open)return openResult(el.dataset.open);if(el.dataset.result)return resultAction(el.dataset.result);if(el.dataset.catalog){state.tab=el.dataset.catalog;render();return}switch(el.dataset.action){case'account':if(!state.signed){openLogin()}else dialog('검토 사용자 · EXMO Lab','로그아웃하면 서버 전송과 조회를 멈춥니다. 로컬 입력·결과와 장비 라이선스는 유지됩니다.',()=>{state.signed=false;navigate(state.surface==='remote'?'remote':state.page)},'로그아웃');break;case'sign-in':if(!state.online){notice('오프라인에서는 새 계정 로그인 없이 로컬 분석을 계속합니다.');break}dialog('브라우저 인증 · 설계 모형','실제 제품은 시스템 브라우저에서 기관 계정을 인증합니다. 여기서는 네트워크 연결 없이 로그인된 화면만 보여줍니다.',()=>{state.signed=true;if(state.page==='login')navigate(state.returnPage);else render()},'로그인 상태 보기');break;case'login-back':navigate(state.returnPage);break;case'finish-setup':state.active=true;state.page='home';render();break;case'compare':state.compare=!state.compare;state.selected=[];state.comparisonMessage='';render();break;case'compare-open':{const issue=comparisonIssue(state.selected);if(state.selected.length<2||issue){state.comparisonMessage=issue||'비교할 결과를 2개 이상 선택하세요.';render();break}dialog('호환 결과 비교 · 설계 모형',`${state.selected.length}개 결과의 수치 비교가 가능합니다. 실제 viewer는 실행하지 않습니다.`);break;}case'publish':if(!state.signed){openLogin();break}if(!state.online){notice('연결 복구 후 로그인과 게시 권한을 다시 확인합니다.');break}dialog('결과 게시 · 예시 기관','측정·QC와 암호화 Mask를 기관 workspace에 보관합니다. 원본 영상은 제외합니다. 이 모형은 실제 데이터를 전송하지 않습니다.',()=>{state.published=true;render()},'게시 완료 상태 보기');break;case'refresh':notice('설계 모형입니다. 실제 서버에 권한 갱신을 요청하지 않았습니다.');break;case'future':dialog('새 솔루션 추가','같은 modality에도 별도 solutionId를 등록합니다. 구매 권한과 검증된 adapter/패키지가 준비된 경우에만 사용할 수 있습니다.');break;case'workspace':dialog('기관 workspace','로그인 계정이 허가받은 기관 결과만 표시합니다. 다른 기관의 객체 ID를 알아도 열람할 수 없어야 합니다.');break}});
app.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target.matches('tr[data-product],tr[data-result]')){event.preventDefault();event.target.click()}});
document.getElementById('scenario').addEventListener('change',event=>{clearTimeout(noticeTimer);document.getElementById('notice').hidden=true;document.getElementById('detail').close();confirmAction=null;state=initial();state.scenario=event.target.value;if(state.scenario==='signed-out')state.signed=false;if(state.scenario==='offline')state.online=false;if(state.scenario==='no-key')state.key=false;if(state.scenario==='setup'){state.active=false;state.signed=false;state.page='setup'}if(state.scenario==='remote'){state.surface='remote';state.page='remote';state.returnPage='remote'}render()});
document.getElementById('dialog-close').addEventListener('click',()=>document.getElementById('detail').close());
document.getElementById('dialog-confirm').addEventListener('click',()=>{document.getElementById('detail').close();confirmAction?.();confirmAction=null});
render();
</script>
</body>
</html>
